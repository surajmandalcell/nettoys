name: macOS package checks

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test core, ownership, resources, and offscreen native views
        run: swift test --jobs 2
      - name: Build and verify the app and embedded helper
        run: make build
      - name: Check clean source stamps and archive the app
        run: |
          test "$(plutil -extract NetToysSourceCommit raw .build/NetToys.app/Contents/Info.plist)" = "$GITHUB_SHA"
          test "$(plutil -extract NetToysSourceCommit raw .build/NetToys.app/Contents/Library/LoginItems/NetToysHelper.app/Contents/Info.plist)" = "$GITHUB_SHA"
          ditto -c -k --keepParent .build/NetToys.app .build/NetToys.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: nettoys-app
          path: .build/NetToys.app.zip
          if-no-files-found: error
          retention-days: 3
